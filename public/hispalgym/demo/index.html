    <!--
      El navegador avisa una sola vez de que puede instalar la aplicación, y lo hace en cuanto lee
      el manifiesto, mucho antes de que React llegue a montarse en un móvil. Si nadie escucha en
      ese momento, el aviso se pierde para siempre y el botón de instalar acaba diciendo que el
      navegador no puede, cuando sí puede. Por eso se recoge aquí, en el primer script de la
      página, y se guarda para quien llegue después. El nombre del evento propio está repetido en
      src/hooks/use-pwa-install.ts, que es quien lo escucha.

      Este es el único script embebido que queda en toda la página, y por eso la política de
      seguridad (public/_headers) lo permite por su hash en vez de con 'unsafe-inline', que abriría
      la puerta a cualquier otro script que alguien lograra inyectar. Ese hash se calcula sobre el
      contenido EXACTO de aquí abajo, con sus saltos de línea CRLF tal cual: tocar una sola coma, o
      que un editor cambie los finales de línea a LF, cambia el hash y la política empieza a
      bloquear este script sin avisar más que en la consola. Si hay que editarlo, recalcula el hash
      (ver el comentario en public/_headers) antes de publicar.
    -->
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.deferredInstallPrompt = event;
        window.dispatchEvent(new Event("installpromptcaptured"));
      });
      window.addEventListener("appinstalled", function () {
        window.deferredInstallPrompt = null;
      });
    </script>
